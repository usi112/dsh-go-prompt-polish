name: check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax
        run: |
          node --check lib/index.js
          node --check lib/polish.js
      - name: Manifest
        run: node -e "const p=require('./package.json'); if(!p.dshGo||!p.dshGo.contributes['composer.actions']) throw new Error('dshGo manifest missing'); console.log('manifest ok', p.name, p.version)"
      - name: Self-test
        run: node test/selftest.mjs
